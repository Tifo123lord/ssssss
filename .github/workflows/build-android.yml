```yaml
name: Build WORLD DOMINION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_FILE="$(find . -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml was not found in the repository."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "FLUTTER_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        shell: bash
        run: cd "$FLUTTER_PROJECT_DIR" && flutter pub get

      - name: Analyze project
        shell: bash
        run: cd "$FLUTTER_PROJECT_DIR" && flutter analyze

      - name: Run tests
        shell: bash
        run: cd "$FLUTTER_PROJECT_DIR" && flutter test

      - name: Build release APK
        shell: bash
        run: cd "$FLUTTER_PROJECT_DIR" && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-dominion-android-apk
          path: ${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
```
