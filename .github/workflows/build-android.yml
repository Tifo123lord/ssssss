
name: Build WORLD DOMINION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: genspark-836c2d0f-bae6-43f7-a322-a5194e93f743-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Check project folder
        run: |
          echo "Project directory:"
          pwd
          ls -la
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in the configured folder."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-DOMINION-APK
          path: genspark-836c2d0f-bae6-43f7-a322-a5194e93f743-main/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
